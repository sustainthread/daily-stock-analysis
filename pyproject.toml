[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-stock-analysis"
version = "1.1.0"
description = "Daily stock screening across US, UK and EU markets with a confidence-score dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "yfinance==0.2.18",
    "pandas==1.5.3",
    "numpy==1.24.3",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools]
py-modules = ["update_data"]
package-dir = { "" = "scripts" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["E501"]